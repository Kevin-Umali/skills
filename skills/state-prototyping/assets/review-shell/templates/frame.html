<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
</head>
<body>
  <main id="root"></main>
  <script type="module">
    // The review shell loads this page with ?state, ?theme and ?reset. Render that state's fixture.
    import { states } from '../states.js';

    const params = new URLSearchParams(location.search);
    const state = states.find((candidate) => candidate.id === params.get('state')) ?? states[0];
    document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';

    // Replace this with the real preview: render state.fixture using fake data and side effects only.
    document.getElementById('root').textContent = `${state.label}: ${JSON.stringify(state.fixture)}`;
  </script>
</body>
</html>
