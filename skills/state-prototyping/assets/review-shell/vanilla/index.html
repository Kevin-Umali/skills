<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype review</title>
  <link rel="stylesheet" href="../core/shell.css">
</head>
<body>
  <div class="rs" id="rs-root" data-inspector="closed" data-sidebar="open" data-changes="on">
    <aside class="rs-side" id="rs-side" aria-label="States">
      <div class="rs-brand"><h1>Prototype review</h1><span>Revision 1</span></div>
      <div class="rs-search">
        <label class="rs-sr" for="rs-query">Search states</label>
        <input id="rs-query" type="search" placeholder="Search states" autocomplete="off" spellcheck="false">
      </div>
      <nav class="rs-list" id="rs-list" aria-label="State list"></nav>
      <p class="rs-legend">
        <span class="rs-mark rs-mark--own" aria-hidden="true"></span>Changed here
        <span class="rs-mark rs-mark--area" aria-hidden="true"></span>Area-wide only
      </p>
      <div class="rs-foot">
        <span id="rs-count" role="status"></span>
        <button type="button" class="rs-btn" id="rs-reset">Reset state</button>
      </div>
    </aside>

    <main class="rs-main">
      <header class="rs-top" id="rs-top">
        <button type="button" class="rs-btn" id="rs-toggle-sidebar" aria-controls="rs-side" aria-pressed="true">Sidebar</button>
        <div class="rs-group" role="group" aria-labelledby="rs-compare-label"><span class="rs-group-label" id="rs-compare-label">Compare</span><div class="rs-seg" id="rs-compare"></div></div>
        <div class="rs-group" role="group" aria-labelledby="rs-width-label"><span class="rs-group-label" id="rs-width-label">Width</span><div class="rs-seg" id="rs-width"></div></div>
        <div class="rs-group" role="group" aria-labelledby="rs-theme-label"><span class="rs-group-label" id="rs-theme-label">Theme</span><div class="rs-seg" id="rs-theme"></div></div>
        <div class="rs-group" data-feature="changes" role="group" aria-labelledby="rs-highlight-label"><span class="rs-group-label" id="rs-highlight-label">Highlight</span><div class="rs-seg"><button type="button" class="rs-btn" id="rs-highlight" aria-pressed="true">Changes</button></div></div>
        <div class="rs-top-end">
          <span class="rs-note" id="rs-link-notice" role="status"></span>
          <button type="button" class="rs-btn" id="rs-copy-link">Copy link</button>
          <button type="button" class="rs-btn" data-feature="changes" id="rs-toggle-inspector" aria-controls="rs-inspector" aria-pressed="false">Changes<span class="rs-badge" id="rs-changes-count"></span></button>
        </div>
      </header>

      <section class="rs-stage" aria-label="Preview">
        <div class="rs-frames" id="rs-frames">
          <div class="rs-frame-wrap" id="rs-wrap-before">
            <div class="rs-frame-head"><span>Before <span class="rs-hint">frozen</span></span><span>Fixture data, no network</span></div>
            <div class="rs-frame-body"><iframe id="rs-frame-before" title="Before preview"></iframe><div class="rs-hl" id="rs-hl-before"></div></div>
          </div>
          <div class="rs-frame-wrap" id="rs-wrap-after">
            <div class="rs-frame-head"><span>After <span class="rs-hint">editable</span></span><span>Fixture data, no network</span></div>
            <div class="rs-frame-body"><iframe id="rs-frame-after" title="After preview"></iframe><div class="rs-hl" id="rs-hl-after"></div></div>
          </div>
        </div>
        <iframe class="rs-probe" id="rs-probe" title="Off-screen measurement" aria-hidden="true" tabindex="-1"></iframe>
      </section>

      <div class="rs-navigator">
        <div class="rs-nav-pill">
          <button type="button" class="rs-btn" id="rs-previous">Previous</button>
          <button type="button" class="rs-btn rs-nav-title" id="rs-details" aria-expanded="false" aria-controls="rs-popover"><strong id="rs-title"></strong><span id="rs-position"></span></button>
          <button type="button" class="rs-btn" id="rs-next">Next</button>
          <div class="rs-pop" id="rs-popover" role="region" aria-label="Fixture details" hidden></div>
        </div>
      </div>
    </main>

    <aside class="rs-inspector" data-feature="changes" id="rs-inspector" aria-label="Changes">
      <div class="rs-insp-head">
        <h2 class="rs-insp-title">Changes</h2>
        <button type="button" class="rs-btn" id="rs-close-inspector" aria-label="Close changes">Close</button>
      </div>
      <div class="rs-insp-body" id="rs-inspector-body"></div>
    </aside>
  </div>
  <div class="rs-sr" id="rs-live" role="status"></div>
  <script type="application/json" id="rs-review-data">{}</script>
  <script type="module" src="main.js"></script>
</body>
</html>
